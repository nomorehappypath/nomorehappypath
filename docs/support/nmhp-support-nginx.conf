# Reverse proxy for the PUBLIC Support receiver only (intake + /healthz).
# The admin case-card page (port 8741) is never proxied here: it stays
# loopback-only, reached by the owner through an SSH tunnel.
server {
    listen 443 ssl;
    server_name support.example.com;  # replace with your Support server's real domain

    ssl_certificate     /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8742;
        proxy_set_header Host $host;
    }
}
